  <rect x="150" y="231" width="267" height="23" rx="9" fill="#172238"/>
  <text x="164" y="247" font-family="Noto Sans JP, sans-serif" font-size="12" fill="#b6c5d8">example.com / long-page</text>
  <rect x="87" y="290" width="417" height="231" rx="10" fill="#f7f9ff"/>
  <rect x="112" y="316" width="244" height="18" rx="7" fill="#a8bfe3"/>
