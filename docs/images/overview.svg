  <rect x="87" y="290" width="417" height="16" fill="#6fbaf3" opacity=".18"/>
</g>
<text x="67" y="590" fill="#fff" font-family="Noto Sans JP, Yu Gothic UI, sans-serif" font-size="24" font-weight="700">1  撮影範囲を指定</text>
