name: "機能改善・新機能の提案"
description: "使いやすさの改善や新しい機能のアイデアはこちらから提案してください。"
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。内容が既存の [Issues](https://github.com/yutodev-03/NobiShot/issues) と重複していないか、可能な範囲で確認してください。
        **社内情報、個人情報、パスワードなどは記載しないでください。**
  - type: textarea
    id: problem
    attributes:
      label: "困っていること・改善したいこと"
      description: "現在の操作で何が不便なのか、どのような場面で必要なのかを教えてください。"
      placeholder: "例：撮影後にすぐファイル名を指定したい"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "提案する機能・改善内容"
      description: "どのように変わると便利になるかを記載してください。"
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: "想定する利用シーン（任意）"
      placeholder: "例：長い設定画面の証跡を毎日撮影している"
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: "代替手段や参考例（任意）"
      description: "現在の回避策や参考になるツールがあれば記載してください。"
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: "投稿前の確認"
      options:
        - label: "文章や添付資料に個人情報・機密情報・認証情報が含まれていないことを確認しました。"
          required: true
