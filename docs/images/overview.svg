  <path d="M568 369H690" stroke="url(#bright)" stroke-width="9" stroke-linecap="round"/>
  <path d="M674 353l22 16-22 16" fill="none" stroke="#74e6d0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="570" y="400" width="113" height="60" rx="14" fill="#223f5d" stroke="#4a7b9e"/>
