<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
<title id="title">NobiShot のスクロールキャプチャの流れ</title>
<desc id="desc">範囲を選び、手動でスクロールし、縦長の画像を作成する説明図。実際のアプリ画面ではありません。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101a2e"/><stop offset="1" stop-color="#12284a"/></linearGradient>
  <linearGradient id="bright" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5ca8ff"/><stop offset="1" stop-color="#76ebca"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020611" flood-opacity=".35"/></filter>
</defs>
<rect width="1280" height="660" rx="28" fill="url(#bg)"/>
<circle cx="1225" cy="30" r="220" fill="#2b6bc0" opacity=".13"/>
<circle cx="30" cy="630" r="190" fill="#46d6c0" opacity=".06"/>
<rect x="52" y="40" width="50" height="50" rx="14" fill="#387fea"/>
<path d="M66 57h22v6H76v6h12v6H66z" fill="white" opacity=".94"/>
<text x="117" y="77" fill="#fff" font-family="Noto Sans JP, Yu Gothic UI, sans-serif" font-size="29" font-weight="700">NobiShot</text>
<text x="52" y="141" fill="#fff" font-family="Noto Sans JP, Yu Gothic UI, sans-serif" font-size="40" font-weight="700">長い画面を、1枚の画像に。</text>
<text x="54" y="181" fill="#b7c9e2" font-family="Noto Sans JP, Yu Gothic UI, sans-serif" font-size="19">範囲を選ぶ  →  手動でスクロール  →  画像を結合して保存</text>
<g filter="url(#shadow)">
  <rect x="50" y="220" width="490" height="334" rx="20" fill="#19243a" stroke="#3a5375" stroke-width="2"/>
  <rect x="50" y="220" width="490" height="45" rx="20" fill="#2b3851"/>
  <rect x="50" y="252" width="490" height="13" fill="#2b3851"/>
